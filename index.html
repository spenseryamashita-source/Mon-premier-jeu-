<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DODGE PRO - Arcade Infini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body {
            background: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #090914;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
            max-width: 100%;
            max-height: 100%;
        }
        #hud {
            position: absolute;
            top: 15px;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
        }
        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .overlay {
            position: absolute;
            text-align: center;
            background: rgba(8, 8, 18, 0.92);
            padding: 25px;
            border-radius: 24px;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            width: 88%;
            max-width: 350px;
            z-index: 5;
        }
        h1 { font-size: 28px; color: #00f3ff; text-shadow: 0 0 15px #00f3ff; margin-bottom: 8px; letter-spacing: 1px; }
        p { color: #bbb; margin-bottom: 18px; font-size: 14px; line-height: 1.4; }
        .btn {
            background: linear-gradient(45deg, #ff007f, #00f3ff);
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.5);
            width: 100%;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-shop {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffd700;
            color: #ffd700;
            box-shadow: none;
            font-size: 15px;
            padding: 10px 20px;
        }
        .skin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .skin-item {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
        }
        .skin-item.selected { border-color: #00f3ff; background: rgba(0, 243, 255, 0.15); }
        .skin-preview { width: 24px; height: 24px; margin: 0 auto 6px; border-radius: 50%; }
        #powerup-bar {
            position: absolute;
            top: 55px;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
            gap: 10px;
            pointer-events: none;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="badge">SCORE: <span id="score">0</span></div>
        <div class="badge" style="color:#ffd700;">⭐ <span id="coins">0</span></div>
        <div class="badge" style="color:#00f3ff;">MAX: <span id="best">0</span></div>
    </div>
    <div id="powerup-bar"></div>

    <div id="menu" class="overlay">
        <h1 id="title">NEON DODGE</h1>
        <p id="subtitle">Glisse ton doigt pour esquiver les blocs. Attrape les boucliers 🛡️ et aimants 🧲 !</p>
        <button class="btn" onclick="startGame()">JOUER</button>
        <button class="btn btn-shop" onclick="openShop()">BOUTIQUE SKINS</button>
    </div>

    <div id="shop" class="overlay" style="display:none;">
        <h1 style="color:#ffd700; text-shadow:0 0 10px #ffd700;">BOUTIQUE</h1>
        <p>Tes étoiles : <strong style="color:#ffd700;" id="shop-coins">0</strong> ⭐</p>
        <div class="skin-grid" id="skin-list"></div>
        <button class="btn" onclick="closeShop()">RETOUR</button>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        canvas.width = Math.min(window.innerWidth, 420);
        canvas.height = window.innerHeight;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let bestScore = parseInt(localStorage.getItem("nd_best")) || 0;
        let totalCoins = parseInt(localStorage.getItem("nd_coins")) || 0;
        let unlockedSkins = JSON.parse(localStorage.getItem("nd_unlocked")) || ["cyan"];
        let currentSkin = localStorage.getItem("nd_skin") || "cyan";

        const SKINS = [
            { id: "cyan", name: "Néon Bleu", color: "#00f3ff", price: 0 },
            { id: "gold", name: "Or Pur", color: "#ffd700", price: 30 },
            { id: "emerald", name: "Émeraude", color: "#00ff88", price: 75 },
            { id: "plasma", name: "Plasma Violet", color: "#d500f9", price: 150 }
        ];

        function updateHUD() {
            document.getElementById("best").innerText = bestScore;
            document.getElementById("coins").innerText = totalCoins;
            document.getElementById("shop-coins").innerText = totalCoins;
        }
        updateHUD();

        function openShop() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("shop").style.display = "block";
            renderShop();
        }
        function closeShop() {
            document.getElementById("shop").style.display = "none";
            document.getElementById("menu").style.display = "block";
        }
        function renderShop() {
            const list = document.getElementById("skin-list");
            list.innerHTML = "";
            SKINS.forEach(s => {
                const isUnlocked = unlockedSkins.includes(s.id);
                const isSelected = currentSkin === s.id;
                const div = document.createElement("div");
                div.className = "skin-item" + (isSelected ? " selected" : "");
                div.innerHTML = `
                    <div class="skin-preview" style="background:${s.color}; box-shadow:0 0 10px ${s.color};"></div>
                    <div style="font-size:13px; font-weight:bold;">${s.name}</div>
                    <div style="font-size:12px; color:#ffd700; margin-top:4px;">
                        ${isSelected ? "ÉQUIPÉ" : (isUnlocked ? "CHOISIR" : s.price + " ⭐")}
                    </div>
                `;
                div.onclick = () => {
                    if (isUnlocked) {
                        currentSkin = s.id;
                        localStorage.setItem("nd_skin", s.id);
                        playSound(600, "sine", 0.1);
                    } else if (totalCoins >= s.price) {
                        totalCoins -= s.price;
                        unlockedSkins.push(s.id);
                        currentSkin = s.id;
                        localStorage.setItem("nd_coins", totalCoins);
                        localStorage.setItem("nd_unlocked", JSON.stringify(unlockedSkins));
                        localStorage.setItem("nd_skin", s.id);
                        playSound(800, "triangle", 0.25);
                    }
                    updateHUD();
                    renderShop();
                };
                list.appendChild(div);
            });
        }

        let gameRunning = false;
        let score = 0;
        let speed = 4.5;
        let frame = 0;
        let shake = 0;
        let levelHue = 190;

        let player = { x: canvas.width / 2, y: canvas.height - 110, r: 15, trail: [], shield: false, magnet: 0 };
        let obstacles = [];
        let items = [];
        let particles = [];

        function movePlayer(clientX) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            let targetX = clientX - rect.left;
            player.x = Math.max(player.r, Math.min(canvas.width - player.r, targetX));
        }

        window.addEventListener("touchmove", e => movePlayer(e.touches[0].clientX));
        window.addEventListener("touchstart", e => movePlayer(e.touches[0].clientX));
        window.addEventListener("mousemove", e => movePlayer(e.clientX));

        function spawnParticles(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    life: 1, color
                });
